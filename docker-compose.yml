services:
  db:
    image: postgres:16-alpine
    container_name: az-vacation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vacation_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vacation_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: az-vacation-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/vacation_booking
    ports:
      - "3000:3000"

volumes:
  pgdata:
